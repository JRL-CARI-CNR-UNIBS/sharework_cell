# ros_gz_bridge: Gazebo -> ROS. Topic names follow the RealSense driver
# layout (<camera>/color/..., <camera>/depth/...), the ZED included. The
# clouds go through points_frame_relay, which fixes their frame id.
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
- ros_topic_name: /zed/color/image_raw
  gz_topic_name: /zed/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  lazy: true
- ros_topic_name: /zed/color/camera_info
  gz_topic_name: /zed/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
  lazy: true
- ros_topic_name: /zed/depth/image_rect_raw
  gz_topic_name: /zed/depth_image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  lazy: true
- ros_topic_name: /zed/gz/points  # to points_frame_relay
  gz_topic_name: /zed/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
  lazy: true
- ros_topic_name: /rs1/color/image_raw
  gz_topic_name: /rs1/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  lazy: true
- ros_topic_name: /rs1/color/camera_info
  gz_topic_name: /rs1/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
  lazy: true
- ros_topic_name: /rs1/depth/image_rect_raw
  gz_topic_name: /rs1/depth_image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  lazy: true
- ros_topic_name: /rs1/gz/points  # to points_frame_relay
  gz_topic_name: /rs1/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
  lazy: true
- ros_topic_name: /rs2/color/image_raw
  gz_topic_name: /rs2/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  lazy: true
- ros_topic_name: /rs2/color/camera_info
  gz_topic_name: /rs2/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
  lazy: true
- ros_topic_name: /rs2/depth/image_rect_raw
  gz_topic_name: /rs2/depth_image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  lazy: true
- ros_topic_name: /rs2/gz/points  # to points_frame_relay
  gz_topic_name: /rs2/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
  lazy: true
